services:
  - type: web
    name: video-extractor-api
    env: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PORT
        generateValue: true
    healthCheckPath: /api/health
